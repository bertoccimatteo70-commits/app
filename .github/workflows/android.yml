name: Build LifeOS APK

on:
  push:
    branches: [main, freebuff/e374e51647df726e31db2253]
    paths:
      - "**.kt"
      - "**.kts"
      - "gradle/**"
      - "gradlew*"
      - "app/build.gradle.kts"
      - "app/src/main/AndroidManifest.xml"
      - "settings.gradle.kts"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Installs cmdline-tools and exports ANDROID_HOME, ANDROID_SDK_ROOT and
      # PATH. License acceptance is done explicitly in the next step: the
      # action's own handler answers at most 10 prompts and blocks once more
      # licenses are pending, which hangs the job.
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: Accept Android SDK licenses and install SDK packages
        run: |
          # Answers are fed from a file, not from `yes | sdkmanager`: the
          # runner shell uses `-o pipefail`, and `yes` gets SIGPIPE (exit
          # 141) as soon as sdkmanager stops reading, failing the step.
          printf 'y\n%.0s' {1..100} > "$RUNNER_TEMP/android-sdk-licenses.txt"
          sdkmanager --licenses < "$RUNNER_TEMP/android-sdk-licenses.txt" > /dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-unit-test-results
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 14
          if-no-files-found: warn

  instrumented-test:
    name: Instrumented startup test (emulator)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: Accept Android SDK licenses and install SDK packages
        run: |
          printf 'y\n%.0s' {1..100} > "$RUNNER_TEMP/android-sdk-licenses.txt"
          sdkmanager --licenses < "$RUNNER_TEMP/android-sdk-licenses.txt" > /dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # The emulator needs hardware acceleration: make the KVM device usable by
      # the non-root runner user on the hosted Ubuntu VM.
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim
            -camera-back none -camera-front none -no-snapshot
          script: |
            chmod +x gradlew
            ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-instrumented-test-results
          path: |
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected
          retention-days: 14
          if-no-files-found: warn

  build:
    name: Debug and Release APK
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: Accept Android SDK licenses and install SDK packages
        run: |
          printf 'y\n%.0s' {1..100} > "$RUNNER_TEMP/android-sdk-licenses.txt"
          sdkmanager --licenses < "$RUNNER_TEMP/android-sdk-licenses.txt" > /dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # The release keystore is never committed. It is restored here from
      # repository secrets so the CI artifact is signed with the real key.
      - name: Configure release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > keystore/lifeos-release.jks
            {
              echo "storeFile=keystore/lifeos-release.jks"
              echo "storePassword=$RELEASE_STORE_PASSWORD"
              echo "keyAlias=$RELEASE_KEY_ALIAS"
              echo "keyPassword=$RELEASE_KEY_PASSWORD"
            } > keystore.properties
            echo "Release keystore restored from secrets."
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 is not configured: the release APK will be unsigned."
          fi

      - name: Build debug APK
        run: |
          chmod +x gradlew
          rm -f app/build/outputs/apk/debug/app-debug.apk
          ./gradlew :app:assembleDebug --stacktrace

      - name: Build release APK
        run: |
          rm -f app/build/outputs/apk/release/*.apk
          ./gradlew :app:assembleRelease --stacktrace

      - name: Verify release signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "Checking $APK"
          if [ -f keystore.properties ]; then
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          else
            echo "::warning::Release APK is unsigned: add the RELEASE_* secrets to sign it in CI."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: LifeOS-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: LifeOS-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error
