name: Build LifeOS APK

on:
  push:
    branches: [main, freebuff/e374e51647df726e31db2253]
    paths:
      - "**.kt"
      - "**.kts"
      - "gradle/**"
      - "gradlew*"
      - "app/build.gradle.kts"
      - "app/src/main/AndroidManifest.xml"
      - "settings.gradle.kts"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Installs cmdline-tools and exports ANDROID_HOME, ANDROID_SDK_ROOT and
      # PATH. License acceptance is done explicitly in the next step: the
      # action's own handler answers at most 10 prompts and blocks once more
      # licenses are pending, which hangs the job.
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: Accept Android SDK licenses and install SDK packages
        run: |
          # Answers are fed from a file, not from `yes | sdkmanager`: the
          # runner shell uses `-o pipefail`, and `yes` gets SIGPIPE (exit
          # 141) as soon as sdkmanager stops reading, failing the step.
          printf 'y\n%.0s' {1..100} > "$RUNNER_TEMP/android-sdk-licenses.txt"
          sdkmanager --licenses < "$RUNNER_TEMP/android-sdk-licenses.txt" > /dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-unit-test-results
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 14
          if-no-files-found: warn

  build:
    name: Debug and Release APK
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: Accept Android SDK licenses and install SDK packages
        run: |
          printf 'y\n%.0s' {1..100} > "$RUNNER_TEMP/android-sdk-licenses.txt"
          sdkmanager --licenses < "$RUNNER_TEMP/android-sdk-licenses.txt" > /dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          rm -f app/build/outputs/apk/debug/app-debug.apk
          ./gradlew :app:assembleDebug --stacktrace

      - name: Build release APK
        run: |
          rm -f app/build/outputs/apk/release/*.apk
          ./gradlew :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: LifeOS-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: LifeOS-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error
